[project]
name = "houseprices"
version = "0.1.0"
description = "UK house prices per square metre — PPD × EPC pipeline"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pyarrow>=24.0.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.0",
    "nbconvert>=7.17.1",
    "matplotlib>=3.11.1",
    "folium>=0.17.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "mypy>=2.1.0",
    "ruff>=0.16.0",
    "pandas-stubs>=3.0.5.260730",
    "types-requests>=2.33.0.20260712",
    "nbstripout>=0.9.0",
    "watchfiles>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houseprices"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["notebooks/", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "livereload>=2.7.1",
    "pytest-cov>=7.0.0",
]

